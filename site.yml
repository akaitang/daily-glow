name: Daily Glow - Update content and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_content:
        description: "Generate new sourced content now (requires OPENAI_API_KEY secret)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "10 0 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-glow-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's researched content
        if: github.event_name == 'schedule' || inputs.generate_content == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not set. Keeping built-in date rotation; no fresh AI content was generated."
            exit 0
          fi
          python scripts/generate_daily.py

      - name: Commit generated content
        if: github.event_name == 'schedule' || inputs.generate_content == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/today.json content/archive.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Daily Glow content"
            git push
          else
            echo "No content changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
